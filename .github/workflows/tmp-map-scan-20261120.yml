{"name":"tmp-map-scan-20261120","on":{"push":{"paths":["triggers/map-scan-20261120.txt"]},"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"v":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4","with":{"fetch-depth":1}},{"uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"name":"scan","run":"python3 - <<'PY'\nimport os,re,subprocess\nos.makedirs('docs',exist_ok=True)\no=[]\nfiles=subprocess.run(['git','ls-files'],capture_output=True,text=True).stdout.split(chr(10))\ntargets=[f for f in files if f.endswith(('.py','.js','.ts','.html','.md','.json','.yml','.yaml','.txt')) and not f.startswith(('docs/wiki/','docs/reg-','docs/verify','docs/diff','docs/lic','docs/tmp')) and not re.match(r'^[^/]+/(meta\\.json|LICENSE|LICENSE-SOURCE|CREDITS|pack)',f)]\npats=['assets-3d-lowpoly-2','assets-3d-polyfork','repo','github.com/sigco3111','raw.githubusercontent','assets-3d','lowpoly-2']\no.append('scanned files=%d'%len(targets))\nfor f in targets:\n try: t=open(f,encoding='utf-8',errors='ignore').read()\n except Exception: continue\n if len(t)>400000: t=t[:400000]\n hits=[]\n for p in ['assets-3d-lowpoly-2','assets-3d-polyfork']:\n  c=t.count(p)\n  if c: hits.append('%s x%d'%(p,c))\n if hits:\n  o.append('FILE '+f+' : '+', '.join(hits))\n  for m in list(re.finditer(r'assets-3d-lowpoly-2|assets-3d-polyfork',t))[:4]:\n   s=t[max(0,m.start()-90):m.end()+60].replace(chr(10),' ')\n   o.append('    ...'+s+'...')\nopen('docs/map-scan-20261120.md','w',encoding='utf-8').write(chr(10).join(o)+chr(10))\nprint(chr(10).join(o)[:3000])\nPY"},{"name":"commit","run":"git config user.name github-actions[bot]\ngit config user.email 41898282+github-actions[bot]@users.noreply.github.com\ngit add docs/map-scan-20261120.md\ngit commit -q -m 'tmp map scan'\ngit push -q origin HEAD:main"}]}}}
