{"name":"tmp-a112-reg2","on":{"push":{"branches":["main"],"paths":[".github/workflows/tmp-a112-reg2.yml"]}},"permissions":{"contents":"write"},"jobs":{"reg":{"runs-on":"ubuntu-latest","timeout-minutes":10,"steps":[{"uses":"actions/checkout@v4","with":{"fetch-depth":0}},{"uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"name":"register","run":"python3 - <<'PY'\nimport csv, io, os, subprocess, sys\nEXPECT = ['name','repo','file','type','tags','author','source_url','license','attribution','added','notes']\nNAME = 'Poly Haven Grass Medium 01'\ntext = open('catalog.csv', 'rb').read().decode('utf-8')\nrows = list(csv.reader(io.StringIO(text, newline='')))\nassert rows[0] == EXPECT, 'header mismatch: %r' % rows[0]\nn_before = len(rows) - 1\nprint('before data rows: %d' % n_before)\nif any(r and r[0].strip() == NAME for r in rows[1:]):\n    print('ALREADY REGISTERED: no change')\n    open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8').write('ALREADY REGISTERED (no change, count %d)\\n' % n_before)\n    sys.exit(0)\nassert n_before == 1939, 'expected 1939 before, got %d' % n_before\nfrom collections import Counter\ncnt = Counter(r[3] for r in rows[1:] if len(r) > 3 and '3D' in r[3])\nassert cnt, 'no 3D type value found'\ntype3d = cnt.most_common(1)[0][0]\nprint('type from existing 3D rows: ' + type3d)\nnew = [NAME,'assets-3d-lowpoly-2','polyhaven-grass-medium-01/polyhaven-grass-medium-01.zip',type3d,'grass,vegetation,poly haven','Poly Haven','https://polyhaven.com/a/grass_medium_01','CC0','optional: Poly Haven (polyhaven.com)','2026-11-17','원본 CC0 표기 확인 (LICENSE.txt, LICENSE-SOURCE.txt; 수집 커밋 2930d0d)']\nassert len(new) == len(EXPECT)\nbuf = io.StringIO()\ncsv.writer(buf, lineterminator='\\n').writerow(new)\nout = (text if text.endswith('\\n') else text + '\\n') + buf.getvalue()\nopen('catalog.csv', 'w', encoding='utf-8', newline='').write(out)\nrows2 = list(csv.reader(io.StringIO(out, newline='')))\nassert rows2[0] == EXPECT\nn_after = len(rows2) - 1\nassert n_after == 1940, 'after %d' % n_after\nassert rows2[1:-1] == rows[1:], 'existing rows changed'\nassert rows2[-1] == new\nmsg = '카탈로그: A112 Poly Haven 1팩 등록 (%d→%d)' % (n_before, n_after)\nopen('/tmp/msg.txt','w',encoding='utf-8').write(msg)\nprint('COUNT %d -> %d OK; existing rows unchanged' % (n_before, n_after))\nPY\n"},{"name":"commit and push","run":"set +e\ngit config user.name asset-collector\ngit config user.email asset-collector@users.noreply.github.com\ngit add catalog.csv\ngit commit -m \"$(cat /tmp/msg.txt)\" > /tmp/c.log 2>&1 || { echo 'NOCHANGE'; cat /tmp/c.log; }\nok=0\nfor i in 1 2 3; do\n  git pull --rebase origin main >> /tmp/c.log 2>&1\n  if git push origin HEAD:main >> /tmp/c.log 2>&1; then ok=1; break; fi\n  echo \"push attempt $i rejected, retrying\" >> /tmp/c.log\n  sleep 3\ndone\nSHA=$(git rev-parse --short HEAD)\nif [ $ok = 1 ]; then echo \"PUSH OK attempt=$i sha=$SHA\" | tee -a $GITHUB_STEP_SUMMARY; else echo \"PUSH FAILED after 3 attempts sha=$SHA\" | tee -a $GITHUB_STEP_SUMMARY; exit 1; fi"}]}}}
