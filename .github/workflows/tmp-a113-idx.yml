{"name":"tmp-a113-idx","on":{"push":{"branches":["main"],"paths":[".github/workflows/tmp-a113-idx.yml"]}},"permissions":{"contents":"write"},"jobs":{"idx":{"runs-on":"ubuntu-latest","timeout-minutes":20,"steps":[{"uses":"actions/checkout@v4","with":{"fetch-depth":0}},{"uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"name":"write doc helper","run":"cat > /tmp/doc.py <<'PY'\nimport re, csv, io\ncat = open('catalog.csv','rb').read().decode('utf-8')\nrows = list(csv.DictReader(io.StringIO(cat, newline='')))\nassert len(rows) == 1941, len(rows)\nper = {}\nfor r in rows: per[r['repo'].strip()] = per.get(r['repo'].strip(), 0) + 1\nrd = open('README.md', encoding='utf-8').read()\nrd2, n1 = re.subn(r'총 ?[0-9,]+ ?팩입니다', '총 1,941팩입니다', rd, count=1)\nassert n1 == 1, 'total line not found'\nrd2, n2 = re.subn(r'(assets-3d-lowpoly-2[^\\n|]*\\|[^\\n|]*\\|)\\s*[0-9,]+\\s*\\|', lambda m: m.group(1) + ' %d |' % per['assets-3d-lowpoly-2'], rd2, count=1)\nassert n2 == 1, 'repo table row not found'\nprint('::notice::DOC2 repo_counts=%s total=%d' % (sorted(per.items()), len(rows)))\nhi = open('docs/COLLECTION-HISTORY.md', encoding='utf-8').read()\nassert hi.startswith('# ')\nentry = '## A113 ambientCG 1팩 등록\\n\\n- 팩: Concrete 049 (ambientcg-concrete049, 3D 모델)\\n- 라이선스: CC0 (ambientCG 페이지 표기 확인)\\n- 저장소: assets-3d-lowpoly-2, 수집 커밋 713c5a9\\n- 포털 등록: catalog.csv 1940→1941 (등록 커밋 f8336e3, 14열, preview=ambientcg-concrete049/preview.jpg)\\n- 출처: https://ambientcg.com/a/Concrete049\\n'\nk = hi.index('\\n') + 1\nhi2 = hi[:k] + '\\n' + entry + '\\n' + hi[k:].lstrip('\\n')\nopen('README.md', 'w', encoding='utf-8').write(rd2)\nopen('docs/COLLECTION-HISTORY.md', 'w', encoding='utf-8').write(hi2)\nprint('::notice::DOC2 README total=1,941 and A113 entry added')\nPY\n"},{"name":"rebuild index, docs, push","run":"set -e\npython3 tools/build_index.py > /tmp/i1.log 2>&1 || { tail -c 500 /tmp/i1.log; echo '::error::INDEX build_index failed'; exit 1; }\npython3 tools/build_wiki.py > /tmp/i2.log 2>&1 || { tail -c 500 /tmp/i2.log; echo '::error::INDEX build_wiki failed'; exit 1; }\nROWS=$(python3 -c \"import csv,io;print(len(list(csv.DictReader(io.StringIO(open('catalog.csv','rb').read().decode('utf-8'),newline='')))))\")\ngit add -A assets-index*.json docs llms.txt\nCH=$(git diff --cached --name-only | tr '\\n' ' ')\necho \"::notice::INDEX catalog_rows=$ROWS changed_files=$CH\"\nif [ -n \"$CH\" ]; then git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '색인: 수동 갱신 (A113 ambientCG)'; fi\npython3 /tmp/doc.py\ngit add README.md docs/COLLECTION-HISTORY.md\ngit -c user.name=asset-collector -c user.email=asset-collector@users.noreply.github.com commit -m '문서: A113 ambientCG 1팩 반영 (README 1,941, 수집 이력)'\nok=0\nfor i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && { ok=1; break; }; sleep 3; done\nif [ $ok = 1 ]; then echo \"::notice::INDEX PUSH OK sha=$(git rev-parse --short HEAD)\"; else echo '::error::INDEX PUSH FAILED'; exit 1; fi\n"}]}}}
