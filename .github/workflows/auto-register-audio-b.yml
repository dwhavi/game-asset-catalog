{"name":"auto-register-audio-b","on":{"push":{"paths":["triggers/register-audio-b-run.txt"]},"workflow_dispatch":{}},"concurrency":{"group":"auto-register-audio-b","cancel-in-progress":false},"permissions":{"contents":"write"},"jobs":{"register":{"runs-on":"ubuntu-latest","timeout-minutes":30,"steps":[{"uses":"actions/checkout@v4","with":{"fetch-depth":1}},{"uses":"actions/checkout@v4","with":{"repository":"sigco3111/assets-audio","path":"assets","fetch-depth":1}},{"uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"name":"transform register code","run":"python3 - <<'PY'\nimport json\nw=json.load(open('.github/workflows/auto-register.yml',encoding='utf-8'))\nrun=[s for s in w['jobs']['register']['steps'] if s.get('name')=='register'][0]['run']\nbody=run.split('\\n',1)[1].rsplit('\\nPY',1)[0]\nR=[(\"'assets-3d-lowpoly-2', m['file']\",\"'assets-audio', m['file']\"),(\"m['file'], '3D 모델'\",\"m['file'], m.get('kind') or '효과음'\"),(\"d + '/' + m['preview']\",\"(d + '/' + m['preview'] if m['preview'] else '')\"),(\"if not os.path.isfile(os.path.join(ASSET, d, 'preview.png')):\",\"if m['preview'] and not os.path.isfile(os.path.join(ASSET, d, 'preview.png')):\")]\nfor a,b in R:\n assert body.count(a)==1,(a,body.count(a))\n body=body.replace(a,b)\nopen('/tmp/register.py','w',encoding='utf-8').write(body)\nprint('transform ok',len(body))\nPY"},{"name":"register","env":{"GH_TOKEN":"${{ secrets.GITHUB_TOKEN }}"},"run":"python3 /tmp/register.py"}]}}}
