{"name":"tmp catalog A116","on":{"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"fix":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"run":"cat > /tmp/cat.py <<'EOF'\nimport csv,io,os\nL=[]\ndef log(*a): L.append(' '.join(str(x) for x in a))\nGOTH='Goth female - Fleur du Mal'\nGUN='3D Gun Part 1 - Free Version'\nTARGET={GOTH:'goth-female-fleur-du-mal/preview.png', GUN:'3d-gun-part-1-free-version/preview.png'}\ntry:\n    raw=open('catalog.csv','rb').read().decode('utf-8')\n    assert raw.endswith('\\n')\n    lines=raw.splitlines(keepends=True)\n    recs=[];cur=''\n    for ln in lines:\n        cur+=ln\n        if cur.count('\"')%2==0:\n            recs.append(cur);cur=''\n    assert cur==''\n    rows=[list(csv.reader(io.StringIO(r,newline='')))[0] for r in recs]\n    assert all(len(r)==14 for r in rows), 'cols'\n    log('n_before',len(rows)-1)\n    for k in (GOTH,GUN):\n        ids=[i for i,r in enumerate(rows) if i>0 and r[0]==k]\n        log('row',k,ids,[rows[i][11] for i in ids],[rows[i][1] for i in ids])\n        assert len(ids)==1\n    for n in ('Carmilla Vampire','3D Gun Part 2 - Free Version'):\n        for i,r in enumerate(rows):\n            if r[0]==n: log('ref',n,r[11])\n    out=[];changed=[]\n    for i,(rec,r) in enumerate(zip(recs,rows)):\n        if i>0 and r[0] in TARGET and r[11]!=TARGET[r[0]]:\n            nr=list(r); nr[11]=TARGET[r[0]]\n            buf=io.StringIO(); csv.writer(buf,lineterminator='\\n').writerow(nr)\n            out.append(buf.getvalue()); changed.append((i,r[0],r[11],nr[11]))\n        else:\n            out.append(rec)\n    new=''.join(out)\n    nrows=list(csv.reader(io.StringIO(new,newline='')))\n    assert len(nrows)==len(rows), 'count'\n    diff=[i for i in range(len(rows)) if nrows[i]!=rows[i]]\n    log('changed',changed)\n    log('diff idx',diff)\n    assert all(i in [c[0] for c in changed] for i in diff)\n    log('n_after',len(nrows)-1)\n    if changed:\n        open('catalog.csv','wb').write(new.encode('utf-8'))\n    rd=open('README.md',encoding='utf-8').read()\n    log('readme total lines',[l for l in rd.split('\\n') if '총 ' in l and '팩' in l][:3])\n    if '총 1,942팩' in rd:\n        open('README.md','w',encoding='utf-8').write(rd.replace('총 1,942팩','총 1,943팩',1)); log('readme 1942->1943')\nexcept Exception as e:\n    log('ERR',repr(e))\nopen('tmp-catalog-diag.txt','w').write('\\n'.join(L)+'\\n')\nEOF\npython3 /tmp/cat.py; cat tmp-catalog-diag.txt; ! grep -q '^ERR' tmp-catalog-diag.txt"},{"run":"git config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit add catalog.csv README.md tmp-catalog-diag.txt\nif ! git diff --cached --quiet; then git commit -q -m '카탈로그: 썸네일 보완 (Goth female, Gun Part 1)'; git pull --rebase -q origin main; git push -q origin HEAD:main; fi\npython3 tools/build_index.py; python3 tools/build_wiki.py\ngit add -A\nif ! git diff --cached --quiet; then git commit -q -m '색인: 수동 갱신 (썸네일 보완 Goth female, Gun Part 1)'; git pull --rebase -q origin main; git push -q origin HEAD:main; fi\ngit log --oneline -3"}]}}}
