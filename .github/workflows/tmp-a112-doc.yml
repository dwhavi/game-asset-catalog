{"name":"tmp-a112-doc","on":{"push":{"branches":["main"],"paths":[".github/workflows/tmp-a112-doc.yml"]}},"permissions":{"contents":"write"},"jobs":{"doc":{"runs-on":"ubuntu-latest","timeout-minutes":10,"steps":[{"uses":"actions/checkout@v4","with":{"fetch-depth":0}},{"uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"name":"docs","run":"python3 - <<'PY'\nimport csv, io, os, re, sys, traceback\ntry:\n    cat = open('catalog.csv','rb').read().decode('utf-8')\n    rows = list(csv.DictReader(io.StringIO(cat, newline='')))\n    total = len(rows)\n    assert total == 1940, 'catalog rows %d' % total\n    per = {}\n    for r in rows: per[r['repo'].strip()] = per.get(r['repo'].strip(), 0) + 1\n    print('::notice::DOC catalog=%d repo_counts=%s' % (total, sorted(per.items())))\n    rd = open('README.md','r',encoding='utf-8').read()\n    hi = open('docs/COLLECTION-HISTORY.md','r',encoding='utf-8').read()\n    m = re.search(r'총 ?([0-9,]+) ?팩입니다', rd)\n    assert m, 'README total line not found'\n    old_total = m.group(1)\n    print('::notice::DOC README old total text=%s' % old_total)\n    rd2 = re.sub(r'총 ?[0-9,]+ ?팩입니다', '총 1,940팩입니다', rd, count=1)\n    rd2 = re.sub(r'(assets-3d-lowpoly-2[^\\n|]*\\|[^\\n|]*\\|)\\s*[0-9,]+\\s*\\|', lambda mm: mm.group(1) + ' %s |' % format(per.get('assets-3d-lowpoly-2',0),','), rd2, count=1)\n    qnote = '※ Quaternius 팩: 팩 페이지는 CC0로 표기하지만 Quaternius 사이트의 공통 라이선스(QAL)는 에셋 단독 재배포를 제한합니다. 사용 전 원 사이트(quaternius.com)에서 확인해 주세요.'\n    if qnote not in rd2:\n        rd2 = rd2.replace('\\n## ', '\\n' + qnote + '\\n\\n## ', 1)\n    entry = '## 2026-11-17 A112 Poly Haven 1팩 등록\\n\\n- 팩: Poly Haven Grass Medium 01 (polyhaven-grass-medium-01)\\n- 라이선스: CC0 (polyhaven.com/license)\\n- 저장소: assets-3d-lowpoly-2, 수집 커밋 2930d0d\\n- 포털 등록: catalog.csv 1939→1940 (행 추가 커밋 545a462, type 수정 커밋 48d2ce9: 3D→3D 모델, 같은 repo 직전 행 형식)\\n- 열: 14열 헤더 (preview, sample, split 포함), preview=polyhaven-grass-medium-01/preview.png, sample·split 빈 값\\n'\n    if not hi.startswith('# '):\n        raise AssertionError('history file head unexpected: %r' % hi[:40])\n    first_nl = hi.index('\\n') + 1\n    hi2 = hi[:first_nl] + '\\n' + entry + '\\n' + hi[first_nl:].lstrip('\\n')\n    open('README.md','w',encoding='utf-8').write(rd2)\n    open('docs/COLLECTION-HISTORY.md','w',encoding='utf-8').write(hi2)\n    print('::notice::DOC README total=1,940 and history entry added at top')\n    open('/tmp/msg.txt','w',encoding='utf-8').write('문서: A112 Poly Haven 1팩 반영 (README 팩 수 1,940, 수집 이력 맨 위 기록)')\nexcept BaseException as e:\n    print('::error::DOC ' + (('%s: %s' % (type(e).__name__, e))[:300]).replace('\\n',' '))\n    traceback.print_exc()\n    sys.exit(1)\nPY\n"},{"name":"commit and push","run":"git config user.name asset-collector\ngit config user.email asset-collector@users.noreply.github.com\ngit add README.md docs/COLLECTION-HISTORY.md\ngit diff --cached --quiet && { echo '::notice::DOC no diff'; exit 0; }\ngit commit -m \"$(cat /tmp/msg.txt)\" || { echo '::error::DOC commit failed'; exit 1; }\nok=0\nfor i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && { ok=1; break; }; sleep 3; done\nif [ $ok = 1 ]; then echo \"::notice::DOC PUSH OK sha=$(git rev-parse --short HEAD)\"; else echo '::error::DOC PUSH FAILED'; exit 1; fi"}]}}}
