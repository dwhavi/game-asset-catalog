{"name":"tmp-a112-fix","on":{"push":{"branches":["main"],"paths":[".github/workflows/tmp-a112-fix.yml"]}},"permissions":{"contents":"write"},"jobs":{"fix":{"runs-on":"ubuntu-latest","timeout-minutes":10,"steps":[{"uses":"actions/checkout@v4","with":{"fetch-depth":0}},{"uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"name":"fix type","run":"python3 - <<'PY'\nimport csv, io, os, sys, traceback\nfrom collections import Counter\nEXPECT = ['name','repo','file','type','tags','author','source_url','license','attribution','added','notes','preview','sample','split']\nNAME = 'Poly Haven Grass Medium 01'\nREPO = 'assets-3d-lowpoly-2'\ntry:\n    raw = open('catalog.csv','rb').read().decode('utf-8')\n    nl = '\\r\\n' if '\\r\\n' in raw else '\\n'\n    rd = csv.DictReader(io.StringIO(raw, newline=''))\n    if rd.fieldnames != EXPECT:\n        raise AssertionError('header mismatch, actual=%r' % (rd.fieldnames,))\n    rows = list(rd)\n    n_before = len(rows)\n    assert n_before == 1940, 'expected 1940 rows, got %d' % n_before\n    others = [r for r in rows if r['repo'].strip() == REPO and r['name'].strip() != NAME]\n    cnt = Counter(r['type'] for r in others)\n    common = cnt.most_common(1)[0][0]\n    print('::notice::FIX common type in repo %s = %r (counts top3: %s)' % (REPO, common, cnt.most_common(3)))\n    targets = [i for i, r in enumerate(rows) if r['name'].strip() == NAME]\n    assert len(targets) == 1, 'target rows: %d' % len(targets)\n    ti = targets[0]\n    before = rows[ti]['type']\n    print('::notice::FIX target type before = %r' % before)\n    if before == common:\n        print('::notice::FIX already equal, no change')\n        open('/tmp/skip','w').write('1')\n        sys.exit(0)\n    assert before == '3D', 'refusing to edit: type before is %r' % before\n    new_rows = [dict(r) for r in rows]\n    new_rows[ti]['type'] = common\n    buf = io.StringIO()\n    w = csv.DictWriter(buf, fieldnames=EXPECT, lineterminator=nl)\n    w.writeheader()\n    w.writerows(new_rows)\n    out = buf.getvalue()\n    rd2 = csv.DictReader(io.StringIO(out, newline=''))\n    assert rd2.fieldnames == EXPECT\n    rows2 = list(rd2)\n    assert len(rows2) == n_before, 'count changed'\n    for i, (a, b) in enumerate(zip(rows, rows2)):\n        if i == ti:\n            for k in EXPECT:\n                if k != 'type': assert a[k] == b[k], 'target changed in %s' % k\n            assert b['type'] == common\n        else:\n            assert a == b, 'row %d changed' % i\n    open('catalog.csv','w',encoding='utf-8',newline='').write(out)\n    print('::notice::FIX after = %r; rows %d -> %d; only target type cell changed' % (common, n_before, len(rows2)))\n    open('/tmp/msg.txt','w',encoding='utf-8').write('카탈로그: A112 Poly Haven 행 type 수정 (3D→%s)' % common)\nexcept SystemExit:\n    raise\nexcept BaseException as e:\n    print('::error::FIX ' + (('%s: %s' % (type(e).__name__, e))[:300]).replace('\\n',' '))\n    traceback.print_exc()\n    sys.exit(1)\nPY\n"},{"name":"commit and push","run":"if [ -f /tmp/skip ]; then echo 'skip: nothing to change'; exit 0; fi\ngit config user.name asset-collector\ngit config user.email asset-collector@users.noreply.github.com\ngit add catalog.csv\ngit commit -m \"$(cat /tmp/msg.txt)\" || { echo '::error::FIX commit failed'; exit 1; }\nok=0\nfor i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && { ok=1; break; }; sleep 3; done\nSHA=$(git rev-parse --short HEAD)\nif [ $ok = 1 ]; then echo \"::notice::FIX PUSH OK sha=$SHA\"; else echo '::error::FIX PUSH FAILED'; exit 1; fi"}]}}}
