name: tmp-a102-catalog
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: catalog
        run: |
          python3 - <<'PY'
          import csv, io, re, subprocess
          NEW = [
            {"name":"50+ Monsters Pack 3D","repo":"assets-3d-lowpoly-2","file":"50-monsters-pack-3d/50_monsters_pack_3d_version_1.0.zip","type":"3D 모델","tags":"monster,creatures,lowpoly,3d","author":"isaiah658","source_url":"https://opengameart.org/content/50-monsters-pack-3d","license":"CC0","attribution":"optional: isaiah658 (OpenGameArt)","added":"2026-11-16","notes":"파일 286개 (png 229, obj 56); 원본 zip에 라이선스 파일 없음 — LICENSE-SOURCE.txt로 표기 기록; 출처 페이지 대표 이미지를 preview로 저장","preview":"50-monsters-pack-3d/preview.png","sample":"","split":""},
            {"name":"Tiny Treats - Charming Kitchen set","repo":"assets-3d-lowpoly-2","file":"tiny-treats-charming-kitchen-set/tiny_treats_charming_kitchen_1.0.zip","type":"3D 모델","tags":"kitchen,food,lowpoly,cute,3d","author":"Isa Lousberg","source_url":"https://opengameart.org/content/tiny-treats-charming-kitchen-set","license":"CC0","attribution":"optional: Isa Lousberg (OpenGameArt)","added":"2026-11-16","notes":"파일 348개 (fbx 110, obj/mtl/gltf 각 59 이하); zip에 원본 라이선스 파일 포함; 출처 페이지 대표 이미지를 preview로 저장","preview":"tiny-treats-charming-kitchen-set/preview.png","sample":"","split":""},
            {"name":"Tiny Treats - Pretty Park set","repo":"assets-3d-lowpoly-2","file":"tiny-treats-pretty-park-set/tiny_treats_pretty_park_1.0.zip","type":"3D 모델","tags":"park,nature,lowpoly,cute,3d","author":"Isa Lousberg","source_url":"https://opengameart.org/content/tiny-treats-pretty-park-set","license":"CC0","attribution":"optional: Isa Lousberg (OpenGameArt)","added":"2026-11-16","notes":"파일 187개 (fbx 56, obj/mtl/gltf 각 30 이하); zip에 원본 라이선스 파일 포함; 출처 페이지 대표 이미지를 preview로 저장","preview":"tiny-treats-pretty-park-set/preview.png","sample":"","split":""},
            {"name":"Free Lowpoly Pond Kit","repo":"assets-3d-lowpoly-2","file":"releases/download/v1.0/free_pond_kit_assetquest.zip","type":"3D 모델","tags":"pond,water,nature,environment,lowpoly,3d","author":"AssetQuest","source_url":"https://opengameart.org/content/free-lowpoly-pond-kit","license":"CC0","attribution":"optional: AssetQuest (OpenGameArt)","added":"2026-11-16","notes":"파일 93개 (fbx 89, tga 1, png 1); zip에 원본 라이선스 파일 포함; 12.0MB라 v1.0 릴리스 첨부; 출처 페이지 대표 이미지를 preview로 저장","preview":"free-lowpoly-pond-kit/preview.jpg","sample":"","split":""}
          ]
          with open('catalog.csv', 'r', encoding='utf-8', newline='') as f:
              rd = csv.DictReader(f)
              header = rd.fieldnames
              rows = list(rd)
          have = set(r['name'].strip().lower() for r in rows)
          before = len(rows)
          added = []
          for p in NEW:
              if p['name'].strip().lower() in have:
                  print('SKIP dup', p['name']); continue
              rows.append({k: p.get(k, '') for k in header})
              added.append(p)
              print('ADD', p['name'], '| preview=', p['preview'])
          with open('catalog.csv', 'w', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=header, lineterminator='\n')
              w.writeheader()
              for r in rows: w.writerow(r)
          total = len(rows)
          print('ROWS', before, '->', total, 'added', len(added))
          readme = open('README.md', encoding='utf-8').read()
          m = re.search(r'총 (\d+)팩입니다', readme)
          old_total = int(m.group(1)) if m else before
          sec = ['## 2026-11-16 A102 추가 (%d팩, 총 %d팩)' % (len(added), total), '',
                 'A102 라운드: OpenGameArt 3D Art 분류의 최신·즐겨찾기순 목록에서 아직 카탈로그에 없는 CC0 로우폴리 3D 팩 %d개를 모았습니다. 후보는 카탈로그 사이트 검색으로 중복을 확인했고, 팩마다 출처 페이지 License(s)=CC0과 실제 zip 첨부를 확인했습니다.' % len(added), '',
                 '| 팩 | 저장소 | 라이선스 | 수록 위치 |', '| --- | --- | --- | --- |']
          for p in added:
              loc = '릴리스 첨부' if p['file'].startswith('releases/') else '저장소 내 포함'
              sec.append('| [%s](%s) | %s | %s | %s |' % (p['name'], p['source_url'], p['repo'], p['license'], loc))
          sec.append('')
          sec.append('종류: 3D %d팩. 썸네일: 4팩 모두 출처 페이지 대표 이미지를 preview.png/jpg로 저장했고 사이트 카드에서 표시를 확인했습니다. 색인은 rebuild-index.yml 수동 실행으로 갱신합니다.' % len(added))
          sec.append('')
          block = '\n'.join(sec) + '\n'
          i = readme.find('\n## 20')
          readme = readme[:i+1] + block + readme[i+1:]
          readme = re.sub(r'총 \d+팩입니다', '총 %d팩입니다' % total, readme, count=1)
          def fix_repo(mo):
              return mo.group(1) + str(int(mo.group(2)) + len(added)) + '팩'
          readme = re.sub(r'(\| \[assets-3d-lowpoly-2\]\([^)]*\) \| [^|]* \| )(\d+)팩', fix_repo, readme, count=1)
          open('README.md', 'w', encoding='utf-8').write(readme)
          entry = '- 2026-11-16 A102: %s (모두 CC0, %d팩, 3D %d팩, 총 %d팩; assets-3d-lowpoly-2; Free Lowpoly Pond Kit은 v1.0 릴리스 첨부; Quaternius Drive·kenney.nl·poly.pizza·KayKit itch 경로 대신 OpenGameArt 직접 zip 사용; 썸네일 4팩 모두 preview 저장)'
          entry = entry % (', '.join(p['name'] for p in added), len(added), len(added), total)
          log = open('docs/log.md', encoding='utf-8').read()
          if not log.endswith('\n'): log += '\n'
          log += entry + '\n'
          open('docs/log.md', 'w', encoding='utf-8').write(log)
          subprocess.run(['git', 'config', 'user.name', 'sigco3111'], check=True)
          subprocess.run(['git', 'config', 'user.email', 'sigco3111@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'catalog.csv', 'README.md', 'docs/log.md'], check=True)
          subprocess.run(['git', 'commit', '-m', '카탈로그: A102 %d팩 등록' % len(added)], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=False)
          print('TOTAL_NOW', total, 'README_TOTAL_BEFORE', old_total)
          PY
