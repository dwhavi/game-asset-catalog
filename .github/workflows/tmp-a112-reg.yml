{"name":"tmp-a112-reg","on":{"push":{"branches":["main"],"paths":[".github/workflows/tmp-a112-reg.yml"]}},"permissions":{"contents":"write"},"jobs":{"reg":{"runs-on":"ubuntu-latest","timeout-minutes":10,"steps":[{"uses":"actions/checkout@v4","with":{"fetch-depth":1}},{"uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"name":"register","run":"python3 - <<'PY'\nimport csv, io, os, subprocess\npath = 'catalog.csv'\nraw = open(path, 'rb').read()\ntext = raw.decode('utf-8')\nrows = list(csv.reader(io.StringIO(text, newline='')))\nhdr = rows[0]\nEXPECT = ['name','repo','file','type','tags','author','source_url','license','attribution','added','notes']\nassert hdr == EXPECT, 'header mismatch: %r' % hdr\nn_before = len(rows) - 1\nassert n_before == 1939, 'before count %d' % n_before\nfrom collections import Counter\ncnt = Counter(r[3] for r in rows[1:] if len(r) > 3 and '3D' in r[3])\ntypes3d = [t for t, _ in cnt.most_common()]\nprint('3D type counts: ' + repr(cnt.most_common(5)))\nprint('3D type values seen: ' + repr(types3d))\nassert types3d, 'no 3D type value found in catalog'\ntype3d = types3d[0]\nprint('using type: ' + type3d)\nassert not any(r[0].strip() == 'Poly Haven Grass Medium 01' for r in rows[1:]), 'already registered'\nnew = ['Poly Haven Grass Medium 01','assets-3d-lowpoly-2','polyhaven-grass-medium-01/polyhaven-grass-medium-01.zip',type3d,'grass,vegetation,poly haven','Poly Haven','https://polyhaven.com/a/grass_medium_01','CC0','optional: Poly Haven (polyhaven.com)','2026-11-17','원본 CC0 표기 확인 (LICENSE.txt, LICENSE-SOURCE.txt; 수집 커밋 2930d0d)']\nassert len(new) == len(EXPECT)\nbuf = io.StringIO()\nw = csv.writer(buf, lineterminator='\\n')\nw.writerow(new)\nnewline = buf.getvalue()\nout = text if text.endswith('\\n') else text + '\\n'\nout = out + newline\nopen(path, 'w', encoding='utf-8', newline='').write(out)\nrows2 = list(csv.reader(io.StringIO(out, newline='')))\nassert rows2[0] == EXPECT\nn_after = len(rows2) - 1\nassert n_after == 1940, 'after count %d' % n_after\nassert rows2[1:-1] == rows[1:], 'existing rows changed'\nassert rows2[-1] == new\nprint('COUNT %d -> %d OK; existing rows unchanged' % (n_before, n_after))\nopen(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8').write('COUNT %d -> %d OK; existing rows unchanged\\n' % (n_before, n_after))\nopen('/tmp/msg.txt','w').write('카탈로그: A112 Poly Haven 1팩 등록 (%d→%d)' % (n_before, n_after))\nPY\n"},{"name":"commit","run":"git config user.name asset-collector\ngit config user.email asset-collector@users.noreply.github.com\ngit add catalog.csv\ngit commit -m \"$(cat /tmp/msg.txt)\"\ngit push origin HEAD:main\n"}]}}}
