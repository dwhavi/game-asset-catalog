name: reg-ac1
on:
  push:
    branches: [main]
    paths: [.github/workflows/reg-ac1.yml]
jobs:
  reg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: add one row
        run: |
          python3 - <<'PY'
          import csv, io, time, sys, traceback, os
          HDR = ['name','repo','file','type','tags','author','source_url','license','attribution','added','notes','preview','sample','split']
          try:
              raw = open('catalog.csv', 'rb').read().decode('utf-8')
              rdr = csv.DictReader(io.StringIO(raw, newline=''))
              assert rdr.fieldnames == HDR, 'header mismatch %s' % rdr.fieldnames
              rows = list(rdr)
              n_before = len(rows)
              assert n_before == 1940, 'n_before=%d' % n_before
              assert not [r for r in rows if r['name'].strip().lower() == 'concrete 049' or 'ambientcg.com/a/concrete049' in (r.get('source_url') or '').lower()], 'dup'
              row = {'name':'Concrete 049','repo':'assets-3d-lowpoly-2','file':'ambientcg-concrete049/ambientcg-concrete049.zip','type':'3D 모델','tags':'3d,lowpoly,concrete,texture,material,pbr,ambientcg','author':'ambientCG','source_url':'https://ambientcg.com/a/Concrete049','license':'CC0','attribution':'표기 불필요','added':time.strftime('%Y-%m-%d'),'notes':'','preview':'ambientcg-concrete049/preview.jpg','sample':'','split':''}
              out = io.StringIO()
              w = csv.DictWriter(out, fieldnames=HDR, lineterminator='\n'); w.writeheader()
              for r in rows: w.writerow({k: r.get(k, '') for k in HDR})
              w.writerow(row)
              text_out = out.getvalue()
              chk = list(csv.DictReader(io.StringIO(text_out, newline='')))
              assert len(chk) == n_before + 1, 'n_after=%d' % len(chk)
              for a, b in zip(rows, chk[:n_before]):
                  assert a == b, 'existing row changed: ' + a['name']
              assert chk[-1]['name'] == 'Concrete 049'
              open('catalog.csv', 'w', encoding='utf-8', newline='').write(text_out)
              print('::notice::REG n_before=%d n_after=%d header14=ok' % (n_before, len(chk)))
          except BaseException as e:
              print('::error::REG ' + (type(e).__name__ + ': ' + str(e))[:300].replace(chr(10),' '))
              traceback.print_exc()
              sys.exit(1)
          PY
      - name: commit and push
        run: |
          set -e
          git config user.name asset-collector
          git config user.email asset-collector@users.noreply.github.com
          if git diff --quiet -- catalog.csv; then echo '::error::REG no change'; exit 1; fi
          git add catalog.csv
          git commit -m '카탈로그: Concrete 049 추가 (ambientCG 1팩 시험)'
          ok=0
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && { ok=1; break; }; sleep 3; done
          if [ $ok = 1 ]; then echo "::notice::REG PUSH OK sha=$(git rev-parse --short HEAD)"; else echo '::error::REG PUSH FAILED'; exit 1; fi
