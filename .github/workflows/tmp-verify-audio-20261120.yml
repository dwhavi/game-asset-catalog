{"name":"tmp-verify-audio","on":{"push":{"paths":["triggers/verify-audio-20261120.txt"]},"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"v":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4","with":{"fetch-depth":12}},{"name":"verify","env":{"GH_TOKEN":"${{ github.token }}"},"run":"python3 - <<'PY'\nimport csv,subprocess,os\nrows=list(csv.reader(open('catalog.csv',encoding='utf-8')))\nh=rows[0];d=rows[1:]\no=['cols=%d'%len(h),'data=%d'%len(d),'badcols=%d'%sum(1 for r in d if len(r)!=len(h)),'header='+'|'.join(h)]\nfor k in ['Silly Song 1','Stuck in Limbo','western desert']:\n    m=['|'.join(r) for r in d if k in '|'.join(r) and 'assets-audio' in '|'.join(r)]\n    o.append('%s count=%d'%(k,len(m)))\n    o+=['ROW '+x for x in m]\no.append('LAST3')\no+=['|'.join(r) for r in d[-3:]]\nfor s in ['silly-song-1','sometimes-i-feel-like-im-stuck-in-limbo','three-western-desert-like-tracks']:\n    p=subprocess.run(['gh','api','repos/sigco3111/assets-audio/releases/tags/pack-'+s,'--jq','.assets[]|[.name,.size]|@tsv'],capture_output=True,text=True)\n    o.append('REL '+s+' '+(p.stdout+p.stderr).strip().replace('\\n',' ; '))\nos.makedirs('docs',exist_ok=True)\nopen('docs/verify-audio-20261120.md','w',encoding='utf-8').write('\\n'.join(o)+'\\n')\nPY\ngit log -n 4 --numstat --format='COMMIT %h %an %s' -- catalog.csv >> docs/verify-audio-20261120.md\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit add docs/verify-audio-20261120.md\ngit commit -m 'tmp: audio 등록 검증 산출물'\ngit push\n"}]}}}
