{"name":"tmp-a112-idx","on":{"push":{"branches":["main"],"paths":[".github/workflows/tmp-a112-idx.yml"]}},"permissions":{"contents":"write"},"jobs":{"idx":{"runs-on":"ubuntu-latest","timeout-minutes":15,"steps":[{"uses":"actions/checkout@v4","with":{"fetch-depth":0}},{"uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"name":"rebuild index and wiki","run":"set +e\npython3 tools/build_index.py > /tmp/i1.log 2>&1; R1=$?\npython3 tools/build_wiki.py > /tmp/i2.log 2>&1; R2=$?\necho \"::notice::INDEX build_index rc=$R1 build_wiki rc=$R2\"\nif [ $R1 != 0 ] || [ $R2 != 0 ]; then echo '::error::INDEX build failed'; tail -c 600 /tmp/i1.log; tail -c 600 /tmp/i2.log; exit 1; fi\nCATROWS=$(python3 -c \"import csv,io;print(len(list(csv.DictReader(io.StringIO(open('catalog.csv','rb').read().decode('utf-8'),newline='')))))\")\ngit add -A assets-index*.json docs llms.txt 2>/dev/null\nCH=$(git diff --cached --name-only | tr '\\n' ' ')\necho \"::notice::INDEX catalog_rows=$CATROWS changed_files=$CH\"\nif [ -z \"$CH\" ]; then echo '::notice::INDEX no changes'; exit 0; fi\ngit config user.name 'github-actions[bot]'\ngit config user.email '41898282+github-actions[bot]@users.noreply.github.com'\ngit commit -m '색인: 수동 갱신 (A112 Poly Haven)' || { echo '::error::INDEX commit failed'; exit 1; }\nok=0\nfor i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && { ok=1; break; }; sleep 3; done\nif [ $ok = 1 ]; then echo \"::notice::INDEX PUSH OK sha=$(git rev-parse --short HEAD)\"; else echo '::error::INDEX PUSH FAILED'; exit 1; fi"}]}}}
