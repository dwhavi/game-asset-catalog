name: tmp-a102-probe2
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          def get(u):
              r = urllib.request.Request(u, headers={'User-Agent':'Mozilla/5.0'})
              return urllib.request.urlopen(r, timeout=90).read().decode('utf-8','replace')
          idx = json.loads(get('https://raw.githubusercontent.com/sigco3111/game-asset-catalog/main/assets-index.min.json'))
          items = idx if isinstance(idx, list) else (idx.get('packs') or idx.get('assets') or idx.get('items') or [])
          names = set()
          for it in items:
              if not isinstance(it, dict): continue
              for k in ('name','title','slug'):
                  v = it.get(k)
                  if isinstance(v,str) and v.strip(): names.add(' '.join(v.strip().lower().split()))
          base = 'https://opengameart.org/art-search-advanced?keys=&field_art_type_tid%5B%5D=10'
          pages = [('created', p) for p in range(1,16)] + [('count', p) for p in range(1,11)]
          seen = {}
          new = []
          for sb, pg in pages:
              url = base + '&sort_by=%s&sort_order=DESC&page=%d' % (sb, pg)
              try:
                  html = get(url)
              except Exception as e:
                  print('ERR', sb, pg, e); continue
              for m in re.finditer(r'<a href="/content/([a-z0-9\-]+)"[^>]*>([^<]{2,90})</a>', html):
                  slug, title = m.group(1), m.group(2).strip()
                  key = ' '.join(title.lower().split())
                  if slug in seen: continue
                  seen[slug] = title
                  if key not in names:
                      new.append('%s | /content/%s | %s p%s' % (title, slug, sb, pg))
          out = ['INDEX %d packs' % len(items)] + new
          open('tools/tmp-a102-candidates.txt','w').write('\n'.join(out) + '\n')
          print('NEW_TOTAL', len(new), 'SEEN', len(seen))
          print('\n'.join(new[:20]))
          PY
      - name: commit
        run: |
          mkdir -p tools
          git config user.name sigco3111
          git config user.email sigco3111@users.noreply.github.com
          git add -A tools/tmp-a102-candidates.txt
          git commit -m "tmp: A102 후보 목록" || true
          git push
