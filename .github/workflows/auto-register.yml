{"name":"auto-register","on":{"schedule":[{"cron":"40 * * * *"}],"workflow_dispatch":{}},"concurrency":{"group":"auto-register","cancel-in-progress":false},"permissions":{"contents":"write"},"jobs":{"register":{"runs-on":"ubuntu-latest","timeout-minutes":30,"steps":[{"uses":"actions/checkout@v4","with":{"fetch-depth":1}},{"uses":"actions/checkout@v4","with":{"repository":"sigco3111/assets-3d-lowpoly-2","path":"assets","fetch-depth":1}},{"uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"name":"register","run":"python3 - <<'PY'\nimport csv, io, json, os, re, subprocess, sys, datetime\nASSET = os.path.join(os.getcwd(), 'assets')\ndef log(s): print(s)\ndef run(a): return subprocess.run(a, check=True, capture_output=True, text=True).stdout\nraw = open('catalog.csv', 'rb').read()\nassert raw.endswith(b'\\n'), 'catalog ends without newline'\ntxt = raw.decode('utf-8')\nrows = list(csv.reader(io.StringIO(txt, newline='')))\nhdr = rows[0]\nassert len(hdr) == 14 and hdr[0] == 'name' and hdr[6] == 'source_url' and hdr[13] == 'split', hdr\nn_before = len(rows) - 1\nsrcs = {r[6].strip().rstrip('/').lower() for r in rows[1:] if len(r) > 6}\nnms = {r[0].strip().lower() for r in rows[1:] if r}\ncands = []\nfor d in sorted(os.listdir(ASSET)):\n    mp = os.path.join(ASSET, d, 'meta.json')\n    if not os.path.isfile(mp): continue\n    m = json.load(open(mp, encoding='utf-8'))\n    if m['url'].lower().rstrip('/') in srcs or m['name'].lower() in nms:\n        log('SKIP already-registered ' + d); continue\n    if not m['file'].startswith('release:') and not os.path.isfile(os.path.join(ASSET, d, m['zip'])):\n        log('SKIP zip-missing ' + d); continue\n    if not os.path.isfile(os.path.join(ASSET, d, 'preview.png')):\n        log('SKIP preview-missing ' + d); continue\n    if m['license'] not in ('CC0', 'CC-BY 3.0', 'CC-BY 4.0', 'MIT', 'GPL 2.0', 'GPL 3.0', 'OGA-BY 3.0', 'OGA-BY 4.0'):\n        log('SKIP license-not-allowed ' + d); continue\n    cands.append((d, m)); srcs.add(m['url'].lower().rstrip('/')); nms.add(m['name'].lower())\nif not cands:\n    log('NO-NEW-REGISTRATION'); sys.exit(0)\nbuf = io.StringIO()\nw = csv.writer(buf, lineterminator='\\n')\nfor d, m in cands:\n    w.writerow([m['name'], 'assets-3d-lowpoly-2', m['file'], '3D 모델', m['tags'], m['author'], m['url'], m['license'], m['attr'], m['date'], m['notes'], d + '/' + m['preview'], '', ''])\nnew = txt + buf.getvalue()\nrows2 = list(csv.reader(io.StringIO(new, newline='')))\nassert len(rows2) - 1 == n_before + len(cands), 'count'\nassert rows2[:len(rows)] == rows, 'existing rows changed'\nassert all(len(r) == 14 for r in rows2), 'cols'\nopen('catalog.csv', 'wb').write(new.encode('utf-8'))\ntotal = len(rows2) - 1\nlog('CATALOG before=%d after=%d added=%d' % (n_before, total, len(cands)))\ncnt = {}\nfor r in rows2[1:]: cnt[r[1]] = cnt.get(r[1], 0) + 1\nrd = open('README.md', encoding='utf-8').read()\nrd, n1 = re.subn(r'\\*\\*총 [\\d,]+팩입니다\\.\\*\\*', '**총 ' + format(total, ',') + '팩입니다.**', rd)\nassert n1 == 1, 'README total line'\nrd, n2 = re.subn(r'(\\| \\[(assets-[\\w-]+)\\]\\(https://github\\.com/sigco3111/\\2\\) \\|[^\\n]*?\\| )(\\d+)( \\|)', lambda m: m.group(1) + str(cnt.get(m.group(2), 0)) + m.group(4), rd)\nrd, n3 = re.subn(r'\\| \\*\\*합계\\*\\* \\| \\| \\*\\*\\d+\\*\\* \\|', '| **합계** | | **' + str(total) + '** |', rd)\nlog('README repo_rows=%d sum_row=%d' % (n2, n3))\nopen('README.md', 'w', encoding='utf-8').write(rd)\nkst = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9)))\nstamp = 'AUTO-' + kst.strftime('%Y%m%d-%H')\nch = open('docs/COLLECTION-HISTORY.md', encoding='utf-8').read()\nblock = '### ' + stamp + ' 자동 수집 등록 (' + str(len(cands)) + '팩, ' + kst.strftime('%Y-%m-%d %H:%M') + ' KST)\\n\\n'\nfor d, m in cands:\n    block += '- 팩: ' + m['name'] + ' (slug ' + d + '), 라이선스: ' + m['license'] + ', 제작자: ' + m['author'] + '\\n'\n    block += '- 출처: ' + m['url'] + '\\n'\n    block += '- 저장: assets-3d-lowpoly-2 ' + m['file'] + ' (auto-collect 수집)\\n'\n    block += '- 포털 등록: catalog.csv ' + str(n_before) + '→' + str(total) + ', 기존 행 불변 확인\\n'\nblock += '- 규칙 메모: 출처 페이지 License(s) 단일 계열 확인, 복수 라이선스 팩 제외, CREDITS.txt 표기\\n\\n'\nk = re.search(r'^### ', ch, re.M)\nch = ch[:k.start()] + block + ch[k.start():] if k else ch + '\\n' + block\nopen('docs/COLLECTION-HISTORY.md', 'w', encoding='utf-8').write(ch)\nfor cmd in [['python3', 'tools/build_index.py'], ['python3', 'tools/build_wiki.py']]:\n    try:\n        o = subprocess.run(cmd, capture_output=True, text=True, timeout=900)\n        log('index %s rc=%d %s' % (cmd[1], o.returncode, (o.stdout + o.stderr)[-200:].replace('\\n', ' | ')))\n    except Exception as e:\n        log('index exc ' + type(e).__name__)\nrun(['git', 'add', '-A', '--', '.', ':(exclude)assets'])\nif subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode == 0:\n    log('NO-CHANGE'); sys.exit(0)\nnames = ', '.join(m['name'] for d, m in cands)\nrun(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-q', '-m', '카탈로그: ' + names + ' 등록 (' + stamp + ')'])\nfor k2 in range(3):\n    try:\n        run(['git', 'pull', '--rebase', '-q', 'origin', 'main']); run(['git', 'push', '-q', 'origin', 'HEAD:main']); break\n    except subprocess.CalledProcessError:\n        log('push retry ' + str(k2))\nelse:\n    print('::error::push failed'); sys.exit(1)\nlog('REGISTERED commit=' + run(['git', 'rev-parse', '--short', 'HEAD']).strip() + ' total=' + str(total) + ' packs=' + names)\nPY\n"}]}}}
