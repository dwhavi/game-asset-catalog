name: tmp-a102-fix3
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fix
        run: |
          python3 - <<'PY'
          import subprocess
          t = open('README.md', encoding='utf-8').read()
          a = t.find('총 1913팩입니다')
          b = t.find('A102 추가')
          print('total_at', a, 'a102_at', b)
          if a != -1 and b != -1 and a < b:
              t = t[:a] + '총 1909팩입니다' + t[a+len('총 1913팩입니다'):]
              open('README.md', 'w', encoding='utf-8').write(t)
              print('replaced')
          subprocess.run(['git', 'config', 'user.name', 'sigco3111'], check=True)
          subprocess.run(['git', 'config', 'user.email', 'sigco3111@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'README.md'], check=True)
          subprocess.run(['git', 'commit', '-m', '문서: A99 총계 줄 복원(1909)'], check=False)
          subprocess.run(['git', 'pull', '--rebase', 'origin', 'main'], check=False)
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=False)
          PY
      - name: cleanup
        run: |
          git rm -q --ignore-unmatch .github/workflows/tmp-a102-fix3.yml
          git commit -m "정리: A102 임시 워크플로 삭제" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
