{"name":"tmp-a114-type","on":{"push":{"branches":["main"],"paths":[".github/workflows/tmp-a114-type.yml"]}},"permissions":{"contents":"write"},"jobs":{"t":{"runs-on":"ubuntu-latest","timeout-minutes":20,"steps":[{"uses":"actions/checkout@v4","with":{"fetch-depth":0}},{"uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"name":"write helpers","run":"cat > /tmp/typefix.py <<'PY'\nimport csv, io, sys\nHDR=['name','repo','file','type','tags','author','source_url','license','attribution','added','notes','preview','sample','split']\nraw=open('catalog.csv','rb').read().decode('utf-8')\nrdr=csv.DictReader(io.StringIO(raw,newline=''))\nassert rdr.fieldnames==HDR, rdr.fieldnames\nrows=list(rdr)\norig=[dict(r) for r in rows]\nn=len(rows)\nidx=[i for i,r in enumerate(rows) if r['name']=='Concrete 049' and r['repo']=='assets-3d-lowpoly-2']\nassert len(idx)==1, 'matches=%d' % len(idx)\ni=idx[0]\nbefore=rows[i]['type']\nif before=='재질':\n    print('::notice::TYPEFIX before=재질 after=재질 (no change)')\n    open('/tmp/changed','w').write('0'); sys.exit(0)\nassert before=='3D 모델', 'unexpected type %r' % before\nrows[i]['type']='재질'\nout=io.StringIO(); w=csv.DictWriter(out,fieldnames=HDR,lineterminator='\\n'); w.writeheader()\nfor r in rows: w.writerow({k:r.get(k,'') for k in HDR})\nt=out.getvalue()\nchk=list(csv.DictReader(io.StringIO(t,newline='')))\nassert len(chk)==n, 'n changed'\nfor j in range(n):\n    if j!=i: assert chk[j]==orig[j], 'row %d changed' % j\nassert chk[i]['type']=='재질'\nopen('catalog.csv','w',encoding='utf-8',newline='').write(t)\nopen('/tmp/changed','w').write('1')\nprint('::notice::TYPEFIX before=%s after=%s row=%d n=%d' % (before,'재질',i,n))\nPY\ncat > /tmp/doc2.py <<'PY'\np='docs/COLLECTION-HISTORY.md'\ns=open(p,encoding='utf-8').read()\nkey='- 출처: https://ambientcg.com/a/Concrete049\\n'\nassert s.count(key)==1, s.count(key)\nassert '- 분류: 재질' not in s\ns=s.replace(key, key+'- 분류: 재질\\n',1)\nopen(p,'w',encoding='utf-8').write(s)\nprint('::notice::TYPEFIX doc line added')\nPY\n"},{"name":"type fix","run":"set -e\npython3 /tmp/typefix.py\n"},{"name":"commit, index, doc, push","run":"set -e\nCH=$(cat /tmp/changed)\nif [ \"$CH\" != \"1\" ]; then echo '::notice::TYPEFIX no change'; exit 0; fi\ngit config user.name asset-collector\ngit config user.email asset-collector@users.noreply.github.com\ngit add catalog.csv\ngit commit -m '카탈로그: Concrete 049 분류 재질 (A113 type 변경)'\npython3 tools/build_index.py > /tmp/i1.log 2>&1 || { tail -c 500 /tmp/i1.log; echo '::error::INDEX build_index failed'; exit 1; }\npython3 tools/build_wiki.py > /tmp/i2.log 2>&1 || { tail -c 500 /tmp/i2.log; echo '::error::INDEX build_wiki failed'; exit 1; }\nROWS=$(python3 -c \"import csv,io;print(len(list(csv.DictReader(io.StringIO(open('catalog.csv','rb').read().decode('utf-8'),newline='')))))\")\ngit add -A assets-index*.json docs llms.txt\nCHF=$(git diff --cached --name-only | tr '\\n' ' ')\necho \"::notice::INDEX catalog_rows=$ROWS changed_files=$CHF\"\nif [ -n \"$CHF\" ]; then git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m '색인: 수동 갱신 (A113 type 변경)'; fi\npython3 /tmp/doc2.py\ngit add docs/COLLECTION-HISTORY.md\ngit commit -m 'A113 기록: 분류 재질 한 줄 추가'\nok=0\nfor i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && { ok=1; break; }; sleep 3; done\nif [ $ok = 1 ]; then echo \"::notice::TYPEFIX PUSH OK sha=$(git rev-parse --short HEAD)\"; else echo '::error::TYPEFIX PUSH FAILED'; exit 1; fi\n"}]}}}
