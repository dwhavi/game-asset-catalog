name: tmp-a107-cat
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: register
        run: |
          python3 - <<'PY'
          import csv, io, subprocess
          P = [
           ['sissors and a stappler', 'assets-3d-lowpoly-2', 'sissors-and-a-stappler/sissors-and-a-stappler.zip', '3D 모델', 'sissors,and,stappler,lowpoly,3d', 'DREAM_SEARCH_REPEAT', 'https://opengameart.org/content/sissors-and-a-stappler', 'CC0', '2026-11-17', '출처 페이지 License(s)=CC0 확인(2026-11-17); 첨부 zip sissors_and_stapler.zip(389311바이트)을 저장소 트리에 수록; preview.png 썸네일', 'https://raw.githubusercontent.com/sigco3111/assets-3d-lowpoly-2/main/sissors-and-a-stappler/preview.png'],
           ['wheel', 'assets-3d-lowpoly-2', 'wheel/wheel.zip', '3D 모델', 'wheel,lowpoly,3d', 'musher3004', 'https://opengameart.org/content/wheel', 'CC0', '2026-11-17', '출처 페이지 License(s)=CC0 확인(2026-11-17); 첨부 zip wheel.zip(344697바이트)을 저장소 트리에 수록; preview.png 썸네일', 'https://raw.githubusercontent.com/sigco3111/assets-3d-lowpoly-2/main/wheel/preview.png'],
           ['building', 'assets-3d-lowpoly-2', 'building-3/building-3.zip', '3D 모델', 'building,lowpoly,3d', 'musher3004', 'https://opengameart.org/content/building-3', 'CC0', '2026-11-17', '출처 페이지 License(s)=CC0 확인(2026-11-17); 첨부 zip building_3.zip(157598바이트)을 저장소 트리에 수록; preview.png 썸네일', 'https://raw.githubusercontent.com/sigco3111/assets-3d-lowpoly-2/main/building-3/preview.png'],
           ['spell set', 'assets-2d-pixel', 'https://github.com/sigco3111/assets-2d-pixel/releases/download/a107-spell-set/spell-set.zip', '2D 이펙트', 'spell,set,effect,2d,pixel', 'Scribe', 'https://opengameart.org/content/spell-set', 'CC0', '2026-11-17', '출처 페이지 License(s)=CC0 확인(2026-11-17); 첨부 zip spell set.zip(8926107바이트)은 5MB 초과라 Releases(a107-spell-set)에 첨부; preview.png 썸네일', 'https://raw.githubusercontent.com/sigco3111/assets-2d-pixel/main/spell-set/preview.png'],
          ]
          rows = list(csv.DictReader(io.StringIO(open('catalog.csv', encoding='utf-8').read())))
          have = {r['name'].strip().lower() for r in rows}
          add = [p for p in P if p[0].strip().lower() not in have]
          total = len(rows) + len(add)
          print('to add', len(add), 'total', total)
          buf = io.StringIO()
          wr = csv.writer(buf, lineterminator='\n')
          for p in add:
              wr.writerow(p[:8] + [''] + p[8:11] + ['', ''])
          open('catalog.csv', 'a', encoding='utf-8', newline='').write(buf.getvalue())
          rd = open('README.md', encoding='utf-8').read()
          sec = '## 2026-11-17 A107 추가 (%d팩, 총 %d팩)\n\n' % (len(add), total)
          sec += 'A107 라운드: 2026-11-17 KST에 GitHub Actions 러너에서 올라간 팩 4개를 등록했습니다. 모두 출처 페이지 License(s)=CC0을 확인했습니다.\n\n'
          sec += '| 팩 | 저장소 | 라이선스 | 제작자 |\n| --- | --- | --- | --- |\n'
          for p in add:
              sec += '| %s | %s | CC0 | %s |\n' % (p[0], p[1], p[5])
          sec += '\n종류: 3D 3팩(assets-3d-lowpoly-2), 2D 이펙트 1팩(assets-2d-pixel). 팩 폴더에 pack.md·LICENSE-SOURCE.txt·LICENSE-CC0.txt·CREDITS.txt·preview.png가 있습니다. spell set zip은 5MB를 넘어 Releases(a107-spell-set)에 첨부했습니다.\n\n총 %d팩입니다.\n\n' % total
          marker = '![게임 에셋 도서관 실제 화면 - 1,849개 에셋 검색·미리보기](4-game-asset-catalog.jpg)\n'
          print('marker found', marker in rd)
          rd = rd.replace(marker, marker + '\n' + sec, 1) if marker in rd else rd.replace('# game-asset-catalog\n', '# game-asset-catalog\n\n' + sec, 1)
          open('README.md', 'w', encoding='utf-8').write(rd)
          open('docs/log.md', 'a', encoding='utf-8').write('- 2026-11-17 A107: %s (모두 OGA CC0, %d팩, 총 %d팩; 3D 3팩은 assets-3d-lowpoly-2 저장소 트리, spell set(8.9MB) zip은 Releases(a107-spell-set)에 첨부; 2026-11-17 KST 러너에서 올림. 같은 라운드에서 잘못 올라간 Fantasy RPG Icons 2(아이콘 팩)는 assets-2d-pixel에서 삭제 커밋으로 정리함)\n' % (', '.join(p[0] for p in add), len(add), total))
          subprocess.run(['git', 'config', 'user.name', 'sigco3111'], check=True)
          subprocess.run(['git', 'config', 'user.email', '101856311+sigco3111@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'catalog.csv', 'README.md', 'docs/log.md'], check=True)
          subprocess.run(['git', 'commit', '-m', '카탈로그: A107 %d팩 등록' % len(add)], check=True)
          subprocess.run(['git', 'push'], check=True)
          print('OK total', total, 'added', len(add))

          PY
