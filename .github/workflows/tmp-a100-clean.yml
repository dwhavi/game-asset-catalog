name: tmp a100 clean catalog

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clean
        run: |
          git rm -r -q --ignore-unmatch .github/workflows/tmp-a100-catalog.yml .github/workflows/tmp-a100-clean.yml tools/tmp_a100_catalog.py
          git -c user.name="sigco3111" -c user.email="sigco3111k@gmail.com" commit -m "정리: A100 임시 파일 삭제" || true
          git push origin HEAD:main
