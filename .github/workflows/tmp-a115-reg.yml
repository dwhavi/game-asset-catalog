{"name":"tmp-a115-reg","on":{"workflow_dispatch":{}},"permissions":{"contents":"write","actions":"write"},"jobs":{"register":{"runs-on":"ubuntu-latest","timeout-minutes":15,"steps":[{"name":"register","env":{"GH_TOKEN":"${{ github.token }}"},"run":"python3 - <<'PY'\nimport os, json, base64, csv, io, urllib.request, datetime\nTOKEN = os.environ[\"GH_TOKEN\"]\nREPO = os.environ[\"GITHUB_REPOSITORY\"]\nSRC = \"sigco3111/assets-3d-lowpoly-2\"\nSLUG = \"goth-female-fleur-du-mal\"\nTODAY = datetime.date.today().isoformat()\n\ndef api(method, path, body=None):\n    data = json.dumps(body).encode() if body is not None else None\n    req = urllib.request.Request(\"https://api.github.com\" + path, method=method, data=data,\n        headers={\"Authorization\": \"Bearer \" + TOKEN, \"Accept\": \"application/vnd.github+json\", \"User-Agent\": \"reg\"})\n    with urllib.request.urlopen(req, timeout=180) as r:\n        raw = r.read()\n        return json.loads(raw) if raw else {}\n\ndef raw(repo, path):\n    with urllib.request.urlopen(\"https://raw.githubusercontent.com/\" + repo + \"/main/\" + path, timeout=120) as r:\n        return r.read().decode(\"utf8\", \"ignore\")\n\nmeta = {}\nfor line in raw(SRC, SLUG + \"/LICENSE-SOURCE.txt\").splitlines():\n    if \": \" in line:\n        k, v = line.split(\": \", 1)\n        meta[k.strip()] = v.strip()\ntitle = meta[\"title\"]; author = meta[\"author\"]; src = meta[\"source_url\"]; lic = meta[\"license\"]\nprint(\"META\", title, \"|\", author, \"|\", src, \"|\", lic)\n\ncat_text = raw(REPO, \"catalog.csv\")\nrows = list(csv.reader(io.StringIO(cat_text)))\nheader = rows[0]\nprint(\"HEADER\", len(header), \",\".join(header))\nprint(\"ROWS_BEFORE\", len(rows) - 1)\nfor r in rows[1:]:\n    if len(r) > 6 and (r[6].strip() == src or r[0].strip().lower() == title.lower()):\n        raise SystemExit(\"DUPLICATE \" + r[0])\n\nvals = {\"name\": title, \"repo\": \"assets-3d-lowpoly-2\", \"file\": SLUG + \"/\" + SLUG + \".zip\", \"type\": \"3D 캐릭터\",\n        \"tags\": \"goth,character,low-poly\", \"author\": author, \"source_url\": src, \"license\": lic,\n        \"attribution\": \"Required: \" + author + \" (OpenGameArt.org), \" + lic, \"added\": TODAY,\n        \"notes\": \"A115 수집. zip에 LICENSE.txt, CREDITS.txt 포함. 미리보기 없음\", \"preview\": \"\", \"sample\": \"\", \"split\": \"\"}\nout = io.StringIO()\ncsv.writer(out, lineterminator=\"\\n\").writerow([vals.get(h, \"\") for h in header])\nnew_cat = (cat_text if cat_text.endswith(\"\\n\") else cat_text + \"\\n\") + out.getvalue()\nassert new_cat.startswith(cat_text)\nsha = api(\"GET\", \"/repos/\" + REPO + \"/contents/catalog.csv\")[\"sha\"]\napi(\"PUT\", \"/repos/\" + REPO + \"/contents/catalog.csv\", {\"message\": \"카탈로그: \" + title + \" 등록 (A115)\",\n    \"content\": base64.b64encode(new_cat.encode()).decode(), \"sha\": sha, \"branch\": \"main\"})\nprint(\"CATALOG_UPDATED rows_after\", len(rows))\n\nlg = api(\"GET\", \"/repos/\" + REPO + \"/contents/docs/log.md\")\nold = base64.b64decode(lg[\"content\"]).decode(\"utf8\")\nnew = old.rstrip(\"\\n\") + \"\\n\\n- \" + TODAY + \" A115 등록: \" + title + \" (3D 캐릭터, \" + lic + \", \" + src + \") 포털 \" + str(len(rows)) + \"팩\\n\"\napi(\"PUT\", \"/repos/\" + REPO + \"/contents/docs/log.md\", {\"message\": \"docs: A115 \" + title + \" 등록 기록\",\n    \"content\": base64.b64encode(new.encode()).decode(), \"sha\": lg[\"sha\"], \"branch\": \"main\"})\nprint(\"LOG_UPDATED\")\n\napi(\"POST\", \"/repos/\" + REPO + \"/actions/workflows/rebuild-index.yml/dispatches\", {\"ref\": \"main\"})\nprint(\"REBUILD_DISPATCHED\")\n\nPY\n"}]}}}
