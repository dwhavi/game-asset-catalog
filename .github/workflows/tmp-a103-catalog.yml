name: tmp-a103-catalog
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          cat > newrows.json <<'JSON'
          [["Gore Blood Gibs Meat Chunks","assets-2d-pixel","gore-blood-gibs-meat-chunks/rc_art_-_gore_blood_gibs.zip","2D 이펙트","blood,gore,effect,impact,hitspark,2d","Reactorcore","https://opengameart.org/content/gore-blood-gibs-meat-chunks","CC0","optional: Reactorcore (opengameart.org)","2026-11-16","파일 65개; 출처 페이지 License(s)=CC0; CC0 전문 동봉","gore-blood-gibs-meat-chunks/preview.png","",""],["Crab Low Poly Animated 3D Model","assets-3d-lowpoly-2","crab-low-poly-animated-3d-model/crab_0.zip","3D 모델","crab,animated,creature,lowpoly,3d","methodical pixel","https://opengameart.org/content/crab-low-poly-animated-3d-model","CC0","optional: methodical pixel (opengameart.org)","2026-11-16","파일 6개; 출처 페이지 License(s)=CC0; CC0 전문 동봉","crab-low-poly-animated-3d-model/preview.png","",""],["Tree and Plants Low Poly 3D Models","assets-3d-lowpoly-2","releases/download/v1.0/trees_and_plants_0.zip","3D 모델","trees,plants,nature,environment,lowpoly,3d","methodical pixel","https://opengameart.org/content/tree-and-plants-low-poly-3d-models","CC0","optional: methodical pixel (opengameart.org)","2026-11-16","파일 24개; 6.6MB Releases v1.0 첨부; 출처 페이지 License(s)=CC0","tree-and-plants-low-poly-3d-models/preview.png","",""]]
          JSON
          python3 - <<'PY'
          import csv, io, json, os, subprocess
          NEW = json.loads(open('newrows.json', encoding='utf-8').read())
          total_old = 0
          rows = list(csv.reader(open('catalog.csv', encoding='utf-8')))
          total_old = len(rows) - 1
          text = open('catalog.csv', encoding='utf-8').read()
          if not text.endswith('\n'):
              text += '\n'
          with open('catalog.csv', 'w', encoding='utf-8', newline='') as f:
              f.write(text)
              w = csv.writer(f, quoting=csv.QUOTE_MINIMAL, lineterminator='\n')
              for r in NEW:
                  w.writerow(r)
          total = total_old + len(NEW)
          sec = []
          sec.append('## 2026-11-16 A103 추가 (%d팩, 총 %d팩)' % (len(NEW), total))
          sec.append('')
          sec.append('A103 라운드: OpenGameArt 3D Art 최신순 다른 페이지(2~4쪽)에서 아직 카탈로그에 없는 CC0 3D 팩 2개(Crab Low Poly Animated 3D Model, Tree and Plants Low Poly 3D Models — 모두 methodical pixel)와 2D Art 이펙트(타격·고어) 1개(Gore Blood Gibs Meat Chunks — Reactorcore)를 모았습니다. 후보 247개를 러너 안에서 전체 catalog.csv 이름과 대조해 걸러냈고, 팩마다 출처 페이지 License(s)=CC0과 실제 zip 첨부를 확인했습니다.')
          sec.append('')
          sec.append('| 항목 | 내용 |')
          sec.append('| --- | --- |')
          sec.append('| 팩 | Crab Low Poly Animated 3D Model / Tree and Plants Low Poly 3D Models / Gore Blood Gibs Meat Chunks |')
          sec.append('| 저장소 | assets-3d-lowpoly-2 2팩, assets-2d-pixel 1팩 |')
          sec.append('| 라이선스·제작 | CC0 3팩 / methodical pixel 2팩, Reactorcore 1팩 |')
          sec.append('| 출처 | https://opengameart.org/content/crab-low-poly-animated-3d-model , https://opengameart.org/content/tree-and-plants-low-poly-3d-models , https://opengameart.org/content/gore-blood-gibs-meat-chunks |')
          sec.append('')
          sec.append('팩 폴더에 pack.md·LICENSE-SOURCE.txt·LICENSE-CC0.txt·CREDITS.txt가 있고, 세 팩 모두 <팩 폴더>/preview.png 썸네일과 catalog.csv preview 열 경로를 넣었습니다. 색인은 rebuild-index.yml 수동 실행으로 갱신합니다.')
          sec.append('')
          sec.append('총 %d팩입니다.' % total)
          sec.append('')
          block = '\n'.join(sec) + '\n'
          rd = open('README.md', encoding='utf-8').read()
          anchor = '## 2026-11-16 A102 추가'
          assert anchor in rd, 'anchor missing'
          rd = rd.replace(anchor, block + anchor, 1)
          open('README.md', 'w', encoding='utf-8').write(rd)
          log = open('docs/log.md', encoding='utf-8').read()
          if not log.endswith('\n'):
              log += '\n'
          log += '- 2026-11-16 A103: Crab Low Poly Animated 3D Model, Tree and Plants Low Poly 3D Models (methodical pixel, CC0), Gore Blood Gibs Meat Chunks (Reactorcore, CC0) (3팩, 총 %d팩; 3D 2, 2D 이펙트 1; 3d-lowpoly-2 2, 2d-pixel 1)\n' % total
          open('docs/log.md', 'w', encoding='utf-8').write(log)
          subprocess.run(['git', 'config', 'user.name', 'sigco3111'], check=False)
          subprocess.run(['git', 'config', 'user.email', 'sigco3111@users.noreply.github.com'], check=False)
          subprocess.run(['git', 'add', 'catalog.csv', 'README.md', 'docs/log.md'], check=False)
          r = subprocess.run(['git', 'commit', '-m', '카탈로그: A103 3팩 등록'], capture_output=True, text=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=False)
          print('rows_old=%d new=%d total=%d commit=%s' % (total_old, len(NEW), total, r.returncode))
          print(r.stdout[-300:])
          
          PY
