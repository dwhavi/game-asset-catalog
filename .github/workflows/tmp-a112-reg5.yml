{"name":"tmp-a112-reg5","on":{"push":{"branches":["main"],"paths":[".github/workflows/tmp-a112-reg5.yml"]}},"permissions":{"contents":"write"},"jobs":{"reg":{"runs-on":"ubuntu-latest","timeout-minutes":10,"steps":[{"uses":"actions/checkout@v4","with":{"fetch-depth":0}},{"uses":"actions/setup-python@v5","with":{"python-version":"3.12"}},{"name":"register","run":"python3 - <<'PY'\nimport csv, io, os, sys, urllib.request, urllib.error, traceback\nfrom collections import Counter\nEXPECT = ['name','repo','file','type','tags','author','source_url','license','attribution','added','notes','preview','sample','split']\nNAME = 'Poly Haven Grass Medium 01'\nFILE = 'polyhaven-grass-medium-01/polyhaven-grass-medium-01.zip'\ndef head_ok(url):\n    try:\n        r = urllib.request.urlopen(urllib.request.Request(url, method='HEAD', headers={'User-Agent':'asset-collector'}), timeout=30)\n        return r.status == 200\n    except Exception:\n        return False\ntry:\n    raw = open('catalog.csv','rb').read().decode('utf-8')\n    nl = '\\r\\n' if '\\r\\n' in raw else '\\n'\n    ends_nl = raw.endswith('\\n')\n    rd = csv.DictReader(io.StringIO(raw, newline=''))\n    if rd.fieldnames != EXPECT:\n        raise AssertionError('header mismatch, actual=%r' % (rd.fieldnames,))\n    rows = list(rd)\n    n_before = len(rows)\n    if any((r.get('name') or '').strip() == NAME or (r.get('file') or '').strip() == FILE for r in rows):\n        print('::notice::REG5 already registered, no change (count %d)' % n_before)\n        open('/tmp/skip','w').write('1')\n        sys.exit(0)\n    assert n_before == 1939 or n_before > 0, 'empty catalog'\n    cnt = Counter(r['type'] for r in rows if '3D' in (r.get('type') or ''))\n    assert cnt, 'no 3D type value'\n    typ = cnt.most_common(1)[0][0]\n    base = 'https://raw.githubusercontent.com/sigco3111/assets-3d-lowpoly-2/main/polyhaven-grass-medium-01/'\n    preview = ''\n    for ext in ['png','jpg']:\n        if head_ok(base + 'preview.' + ext):\n            preview = 'polyhaven-grass-medium-01/preview.' + ext\n            break\n    print('::notice::REG5 preview=%r type=%r' % (preview, typ))\n    new = {'name':NAME,'repo':'assets-3d-lowpoly-2','file':FILE,'type':typ,'tags':'3d,lowpoly,grass,vegetation,poly haven','author':'Poly Haven','source_url':'https://polyhaven.com/a/grass_medium_01','license':'CC0','attribution':'optional: Poly Haven (polyhaven.com)','added':'2026-11-17','notes':'원본 CC0 표기 확인 (LICENSE.txt, LICENSE-SOURCE.txt; 수집 커밋 2930d0d)','preview':preview,'sample':'','split':''}\n    buf = io.StringIO()\n    csv.DictWriter(buf, fieldnames=EXPECT, lineterminator=nl).writerow(new)\n    addition = buf.getvalue()\n    out = raw + (nl if not ends_nl else '') + addition\n    if not ends_nl:\n        out = out[:-len(nl)]\n    open('catalog.csv','w',encoding='utf-8',newline='').write(out)\n    rd2 = csv.DictReader(io.StringIO(out, newline=''))\n    assert rd2.fieldnames == EXPECT, 'after header changed'\n    rows2 = list(rd2)\n    n_after = len(rows2)\n    assert n_after == n_before + 1, 'count %d -> %d' % (n_before, n_after)\n    assert rows2[:-1] == rows, 'existing rows changed'\n    assert rows2[-1] == new, 'new row mismatch'\n    open('/tmp/msg.txt','w',encoding='utf-8').write('카탈로그: A112 Poly Haven 1팩 등록 (%d→%d)' % (n_before, n_after))\n    print('::notice::REG5 before=%d after=%d' % (n_before, n_after))\nexcept SystemExit:\n    raise\nexcept BaseException as e:\n    print('::error::REG5 ' + (('%s: %s' % (type(e).__name__, e))[:300]).replace('\\n',' '))\n    traceback.print_exc()\n    sys.exit(1)\nPY\n"},{"name":"commit and push","run":"if [ -f /tmp/skip ]; then echo 'skip: already registered'; exit 0; fi\ngit config user.name asset-collector\ngit config user.email asset-collector@users.noreply.github.com\ngit add catalog.csv\ngit commit -m \"$(cat /tmp/msg.txt)\" || { echo '::error::REG5 commit failed'; exit 1; }\nok=0\nfor i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && { ok=1; break; }; sleep 3; done\nSHA=$(git rev-parse --short HEAD)\nif [ $ok = 1 ]; then echo \"::notice::REG5 PUSH OK sha=$SHA\"; else echo '::error::REG5 PUSH FAILED'; exit 1; fi"}]}}}
