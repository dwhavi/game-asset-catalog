name: a104-cat
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run
        run: |
          python3 - <<'PY' > /tmp/c.txt 2>&1 || true
          import io,csv,os,subprocess,urllib.request
          def get(u):
              r=urllib.request.Request(u,headers={"User-Agent":"vooy-asset-bot/1.0"})
              return urllib.request.urlopen(r,timeout=60).read()
          P=[
           {"name":"Fantasy Town Kit","repo":"assets-3d-lowpoly-2","slug":"fantasy-town-kit","file":"kenney_fantasy-town-kit_2.0.zip","author":"Kenney","page":"https://opengameart.org/content/fantasy-town-kit"},
           {"name":"Cartoon Low Poly trees and forest","repo":"assets-3d-lowpoly-2","slug":"cartoon-low-poly-trees-and-forest","file":"gtlf_e_obj.zip","author":"allen yatsura","page":"https://opengameart.org/content/cartoon-low-poly-trees-and-forest"},
           {"name":"Low poly cave assets","repo":"assets-3d-lowpoly-2","slug":"low-poly-cave-assets","file":"low-poly-cave-assets.zip","author":"agdg reject","page":"https://opengameart.org/content/low-poly-cave-assets"},
           {"name":"Weapon Slash - Effect","repo":"assets-2d-pixel","slug":"weapon-slash-effect","file":"weapon-slash-effect.zip","author":"Cethiel","page":"https://opengameart.org/content/weapon-slash-effect"},
           {"name":"Elemental Weapons - Effect","repo":"assets-2d-pixel","slug":"elemental-weapons-effect","file":"elemental-weapons-effect.zip","author":"Cethiel","page":"https://opengameart.org/content/elemental-weapons-effect"},
          ]
          txt=open("catalog.csv",encoding="utf-8").read()
          rows=list(csv.DictReader(io.StringIO(txt)))
          have={r["name"].strip().lower() for r in rows}
          def modal(repo,key):
              from collections import Counter
              v=[r[key] for r in rows if r["repo"]==repo and r.get(key,"").strip()]
              return Counter(v).most_common(1)[0][0] if v else ""
          def exists(repo,slug):
              try:
                  get("https://raw.githubusercontent.com/sigco3111/"+repo+"/main/"+slug+"/preview.png")
                  return True
              except Exception:
                  return False
          add=[]
          for p in P:
              if p["name"].strip().lower() in have:
                  print("SKIP dup",p["name"]); continue
              if not exists(p["repo"],p["slug"]):
                  print("SKIP missing",p["name"]); continue
              t=modal(p["repo"],"type") or ("3D 모델" if "3d" in p["repo"] else "2D 이펙트")
              tags="lowpoly,3d" if "3d" in p["repo"] else "2d,effect"
              add.append([p["name"],p["repo"],p["slug"]+"/"+p["file"],t,tags,p["author"],p["page"],"CC0","", "2026-11-16",
                "출처 페이지 License(s)=CC0 확인; zip 원본 그대로 수록; preview.png 썸네일",
                "https://raw.githubusercontent.com/sigco3111/"+p["repo"]+"/main/"+p["slug"]+"/preview.png","",""])
          print("to add",len(add))
          with open("catalog.csv","a",encoding="utf-8",newline="") as f:
              w=csv.writer(f,lineterminator="\n")
              for r in add:
                  w.writerow(r)
          total=len(rows)+len(add)
          rd=open("README.md",encoding="utf-8").read()
          names=", ".join(a[0] for a in add)
          sec="## 2026-11-16 A104 추가 ("+str(len(add))+"팩, 총 "+str(total)+"팩)\n\nA104 라운드: OpenGameArt 3D Art CC0 최신 목록에서 아직 카탈로그에 없는 3D 팩 3개(Fantasy Town Kit, Cartoon Low Poly trees and forest, Low poly cave assets)와 2D 마법·타격 이펙트 팩(Cethiel)을 모았습니다. 후보는 러너 안에서 전체 catalog.csv 이름과 대조해 걸러냈고, 팩마다 출처 페이지 License(s)=CC0과 zip 첨부를 확인했습니다.\n\n| 팩 | 저장소 | 라이선스 | 제작자 |\n| --- | --- | --- | --- |\n"
          for a in add:
              sec+="| "+a[0]+" | "+a[1]+" | CC0 | "+a[5]+" |\n"
          sec+="\n종류: 3D "+str(sum(1 for a in add if "3d" in a[1]))+"팩, 2D 이펙트 "+str(sum(1 for a in add if "2d" in a[1]))+"팩. 팩 폴더에 zip·pack.md·LICENSE-SOURCE.txt·LICENSE-CC0.txt·CREDITS.txt·preview.png가 있고, catalog.csv preview 열에 저장소 상대경로를 넣었습니다. 색인은 rebuild-index.yml 수동 실행으로 갱신합니다.\n\n총 "+str(total)+"팩입니다.\n\n"
          marker="![게임 에셋 도서관 실제 화면 - 1,849개 에셋 검색·미리보기](4-game-asset-catalog.jpg)\n"
          if marker in rd:
              rd=rd.replace(marker, marker+"\n"+sec,1)
          else:
              rd=rd.replace("# game-asset-catalog\n", "# game-asset-catalog\n\n"+sec,1)
          open("README.md","w",encoding="utf-8").write(rd)
          with open("docs/log.md","a",encoding="utf-8") as f:
              f.write("- 2026-11-16 A104: "+names+" (모두 OGA CC0, "+str(len(add))+"팩, 총 "+str(total)+"팩; 3D는 assets-3d-lowpoly-2, 2D 이펙트는 assets-2d-pixel; 후보는 러너 안에서 catalog.csv 이름과 대조; 3D 3팩 전부 5MB 미만이라 Releases 없이 저장소 포함; Low Poly Weapon Pack은 원본 obj 404로 제외; 용량: assets-3d-lowpoly 약 670MB(주의 근접), assets-3d-lowpoly-2 약 199MB, assets-2d-pixel 약 445MB)\n")
          subprocess.run(["git","config","user.name","sigco3111"],check=True)
          subprocess.run(["git","config","user.email","101856311+sigco3111@users.noreply.github.com"],check=True)
          subprocess.run(["git","add","catalog.csv","README.md","docs/log.md"],check=True)
          subprocess.run(["git","commit","-m","카탈로그: A104 "+str(len(add))+"팩 등록"],check=True)
          subprocess.run(["git","push"],check=True)
          print("OK total",total)
          PY
          cat /tmp/c.txt
