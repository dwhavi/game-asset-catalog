name: tmp readme cleanup
on:
  workflow_dispatch:
    inputs:
      dry:
        description: dry run (no commit)
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      DRY: ${{ inputs.dry && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: split and rewrite README
        run: echo '' | base64 -d > cleanup.py && python3 cleanup.py
      - name: commit
        if: ${{ !inputs.dry }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/COLLECTION-HISTORY.md docs/SOURCE-VERIFICATION.md docs/README-DETAILS.md
          git diff --cached --stat
          git commit -m "문서: README 정리, 수집 이력 docs로 분리"
          git push origin "HEAD:${GITHUB_REF_NAME}"
