{"name":"auto-register-loop","on":{"schedule":[{"cron":"12,27,42,57 * * * *"}],"workflow_dispatch":{}},"concurrency":{"group":"auto-register","cancel-in-progress":false},"permissions":{"contents":"write"},"jobs":{"register":{"runs-on":"ubuntu-latest","timeout-minutes":30,"steps":[{"name":"checkout","uses":"actions/checkout@v4","with":{"fetch-depth":1}},{"name":"원본 auto-register.yml 의 단계를 그대로 실행","env":{"GH_TOKEN":"${{ secrets.GITHUB_TOKEN }}"},"run":"python3 - <<'PY'\nimport json, subprocess, sys\nd = json.load(open('.github/workflows/auto-register.yml'))\nfor st in d['jobs']['register']['steps']:\n    u = st.get('uses', '')\n    if u.startswith('actions/checkout'):\n        w = st.get('with', {})\n        if w.get('repository'):\n            subprocess.run(['git', 'clone', '--depth', '1', 'https://github.com/' + w['repository'] + '.git', w.get('path', 'x')], check=True)\n        continue\n    if 'run' not in st:\n        continue\n    print('== step:', st.get('name'), flush=True)\n    r = subprocess.run(['bash', '-c', st['run']])\n    if r.returncode != 0:\n        sys.exit(r.returncode)\nPY\n"}]}}}
