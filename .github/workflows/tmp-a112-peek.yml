{"name":"tmp-a112-peek","on":{"push":{"branches":["main"],"paths":[".github/workflows/tmp-a112-peek.yml"]}},"jobs":{"peek":{"runs-on":"ubuntu-latest","timeout-minutes":5,"steps":[{"uses":"actions/checkout@v4","with":{"fetch-depth":1}},{"name":"peek","run":"python3 - <<'PY'\nimport csv, io, os, collections\ndef N(s): print('::notice::' + s)\nraw = open('catalog.csv','rb').read().decode('utf-8')\nrd = csv.DictReader(io.StringIO(raw, newline=''))\nhdr = rd.fieldnames\nN('PEEK header_count=%d header=%s' % (len(hdr), '|'.join(hdr)))\nrows = list(rd)\nN('PEEK data_rows=%d' % len(rows))\nfor col in ['preview','sample','split']:\n    c = collections.Counter((r.get(col) or '')[:60] for r in rows)\n    N('PEEK dist %s (distinct=%d): %s' % (col, len(c), ' ; '.join('[%s]x%d' % (k if k else '<empty>', v) for k, v in c.most_common(8))))\ndef fmt(r):\n    return ' | '.join('%s=%s' % (k, (r.get(k) or '')[:80]) for k in hdr)\na = [r for r in rows if r.get('repo','').strip() == 'assets-3d-lowpoly-2']\nN('PEEK repo assets-3d-lowpoly-2 rows=%d; last3 follow' % len(a))\nfor r in a[-3:]: N('PEEK 3d ' + fmt(r))\nb = [r for r in rows if r.get('repo','').strip() == 'assets-2d-pixel' and ((r.get('sample') or '').strip() or (r.get('split') or '').strip())]\nN('PEEK repo assets-2d-pixel with sample/split nonempty rows=%d; first2 follow' % len(b))\nfor r in b[:2]: N('PEEK 2d ' + fmt(r))\nsp = os.environ.get('GITHUB_STEP_SUMMARY')\nif sp: open(sp,'a',encoding='utf-8').write('peek done\\n')\nPY\n"}]}}}
